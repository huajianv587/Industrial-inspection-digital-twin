services:
  web:
    # Compose merges sequences by APPENDING, so a plain `ports: []` would NOT
    # remove the base file's 127.0.0.1:8080:80 publication — web would still
    # publish a host port in TLS mode and the CI validator rejects it ("TLS
    # configuration must not publish the web service"). `!reset []` clears
    # the inherited list (Compose >= 2.24). Caddy is the only public service.
    ports: !reset []

  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?PUBLIC_HOSTNAME is required for TLS mode}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required for TLS mode}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - edge
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
