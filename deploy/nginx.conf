map $http_x_forwarded_proto $inspection_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $inspection_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        client_max_body_size 200m;
    }

    location = /healthz {
        proxy_pass http://api:8000/healthz;
    }

    location = /readyz {
        proxy_pass http://api:8000/readyz;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /index.html {
        try_files $uri =404;
        expires -1;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
